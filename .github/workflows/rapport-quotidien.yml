name: Rapport quotidien (Opel/Fiat Dijon — test)

# Voir docs/WORKFLOW.md. Mode test uniquement : les mails partent vers Quentin et
# Corentin, avec rapport-quotidien@ en copie. Le mode prod n'est pas construit.
#
# Deux passages par jour (heure de Paris) : ~7h30 (VN, VO) et ~11h45 (APV, Directeur,
# Plaque). Le cron GitHub est en UTC et ignore le changement d'heure : chaque passage
# est planifié sur ses deux horaires UTC possibles, et rapport.collecte ne garde que
# celui qui tombe à la bonne heure de Paris (l'autre s'arrête sans rien faire).
# Les déclencheurs planifiés ne s'activent qu'une fois ce fichier sur la branche main.
on:
  schedule:
    - cron: "30 5 * * *"   # 7h30 heure d'été
    - cron: "30 6 * * *"   # 7h30 heure d'hiver
    - cron: "45 9 * * *"   # 11h45 heure d'été
    - cron: "45 10 * * *"  # 11h45 heure d'hiver
  # TEMPORAIRE (essai avant fusion) : un push sur la branche workflow-dijon lance les
  # 5 mails en mode test. À retirer avant de fusionner dans main.
  push:
    branches: [workflow-dijon]
  workflow_dispatch:
    inputs:
      mails:
        description: "Mails à générer (vn, vo, apv, directeur, plaque)"
        required: true
        default: "vn,vo,apv,directeur,plaque"

permissions:
  contents: read

concurrency:
  group: rapport-quotidien
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GWS_CLIENT_ID: ${{ secrets.GWS_CLIENT_ID }}
      GWS_CLIENT_SECRET: ${{ secrets.GWS_CLIENT_SECRET }}
      GWS_REFRESH_TOKEN: ${{ secrets.GWS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 1-2. Contrôle et lecture des Sheets
        id: collecte
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m rapport.collecte --mails "${{ inputs.mails }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            python -m rapport.collecte --mails "vn,vo,apv,directeur,plaque"
          else
            python -m rapport.collecte --passage auto
          fi
          python -c "import json; p=json.load(open('build/plan.json')); print('a_composer=' + ('oui' if p['mails'] else 'non'))" >> "$GITHUB_OUTPUT"
          python -c "import json; p=json.load(open('build/plan.json')); print('a_traiter=' + ('oui' if p['mails'] or p['non_construits'] else 'non'))" >> "$GITHUB_OUTPUT"

      - name: 3-4. Synthèse et mise en page (Claude)
        # Claude Code en ligne de commande (claude-code-action refuse certains
        # déclencheurs, dont push). La sortie de Claude reste dans build/ : elle peut
        # contenir des noms réels, elle n'est pas affichée dans le journal du run.
        if: steps.collecte.outputs.a_composer == 'oui'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          claude -p "Lis le fichier rapport/consignes_composition.md et applique-le intégralement : compose les mails listés dans build/plan.json à partir de build/faits/, et écris les résultats dans build/mails/. Ne modifie aucun autre fichier."             --allowedTools "Read,Write,Glob,Grep" --max-turns 150 > build/claude_sortie.txt 2>&1 || { echo "Claude a terminé en erreur :"; tail -5 build/claude_sortie.txt; }
          echo "Mails composés :"; ls -1 build/mails/ 2>/dev/null || echo "aucun"

      - name: 5-6. Envoi (test) et récapitulatif
        # always() : même si une étape précédente a échoué, on prévient Quentin et
        # Corentin par mail (sauf hors créneau, où il n'y a rien à traiter)
        if: always() && steps.collecte.outputs.a_traiter != 'non'
        run: python -m rapport.envoi --mode test
