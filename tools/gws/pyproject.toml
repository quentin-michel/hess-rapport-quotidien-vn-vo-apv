[project]
name = "gws"
version = "0.1.0"
description = "Google Workspace CLI minimal (lecture Google Sheets) pour le projet hess-rapport-quotidien-vn-vo-apv"
requires-python = ">=3.9"
dependencies = [
    "google-auth>=2.29",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
]

[project.scripts]
gws = "gws.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gws"]
